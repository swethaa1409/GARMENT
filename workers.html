<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workers — AI Garment Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/factory-bg.css">
<link rel="stylesheet" href="css/workers.css">
</head>
<body class="factory-bg">

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark"><i class="fa-solid fa-shirt"></i></div>
      <div class="brand-text"><strong>AI Garment MS</strong><span>Production Suite</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label"><span>Main</span></div>
      <a href="dashboard.html" class="nav-link"><i class="fa-solid fa-grip"></i><span>Dashboard</span></a>
      <a href="orders.html" class="nav-link"><i class="fa-solid fa-cart-shopping"></i><span>Orders</span></a>
      <a href="workers.html" class="nav-link"><i class="fa-solid fa-users"></i><span>Workers</span></a>
      <a href="production.html" class="nav-link"><i class="fa-solid fa-industry"></i><span>Production</span></a>
      <a href="payments.html" class="nav-link"><i class="fa-solid fa-money-check-dollar"></i><span>Payments</span></a>
      <a href="analytics.html" class="nav-link"><i class="fa-solid fa-chart-line"></i><span>AI Analytics</span></a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" class="nav-link" data-logout><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a>
    </div>
  </aside>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-btn" id="sidebarToggle"><i class="fa-solid fa-bars"></i></button>
        <button class="icon-btn" id="mobileMenuToggle"><i class="fa-solid fa-bars"></i></button>
        <div class="page-heading">
          <h1>Workers</h1>
          <p>Manage your production workforce</p>
        </div>
      </div>
      <div class="topbar-right">
        <a href="dashboard.html" class="back-dashboard-btn"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
        <button class="icon-btn" id="darkModeToggle"><i class="fa-solid fa-moon"></i></button>
        <div class="user-chip">
          <div class="avatar" data-user-avatar>A</div>
          <div><span class="u-name" data-user-name>Admin</span><span class="u-role">Administrator</span></div>
        </div>
      </div>
    </header>

    <div class="content-body">

      <div class="card panel">
        <div class="panel-head">
          <div class="search-bar">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="workerSearch" placeholder="Search by name, department or phone…">
          </div>
          <button class="btn btn-primary" id="addWorkerBtn"><i class="fa-solid fa-user-plus"></i> Add Worker</button>
        </div>

        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr><th>Worker ID</th><th>Name</th><th>Department</th><th>Salary</th><th>Phone</th><th>Joined</th><th class="text-right">Actions</th></tr>
            </thead>
            <tbody id="workersBody"></tbody>
          </table>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Add / Edit Modal -->
<div class="modal-overlay" id="workerModal">
  <div class="modal-box">
    <div class="modal-head">
      <h3 id="workerModalTitle">Add New Worker</h3>
      <button class="modal-close" id="closeWorkerModal"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="workerForm">
      <input type="hidden" id="workerEditId">
      <div class="form-grid">
        <div class="form-group full">
          <label for="workerName">Full name</label>
          <input type="text" id="workerName" placeholder="e.g. Ravi Kumar" required>
        </div>
        <div class="form-group">
          <label for="workerDept">Department</label>
          <select id="workerDept" required>
            <option value="Cutting">Cutting</option>
            <option value="Stitching">Stitching</option>
            <option value="Quality Check">Quality Check</option>
            <option value="Packing">Packing</option>
            <option value="Dyeing">Dyeing</option>
            <option value="Finishing">Finishing</option>
          </select>
        </div>
        <div class="form-group">
          <label for="workerSalary">Monthly salary (₹)</label>
          <input type="number" id="workerSalary" min="0" placeholder="e.g. 15000" required>
        </div>
        <div class="form-group full">
          <label for="workerPhone">Phone number</label>
          <input type="tel" id="workerPhone" placeholder="e.g. 9876543210" pattern="[0-9]{10}" maxlength="10" required>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-outline" id="cancelWorkerForm">Cancel</button>
        <button type="submit" class="btn btn-primary" id="saveWorkerBtn"><i class="fa-solid fa-floppy-disk"></i> Save Worker</button>
      </div>
    </form>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/workers.js"></script>
</body>
</html>
